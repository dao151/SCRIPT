<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Changeur de couleurs</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 60px;
      }

      #color-box {
        width: 200px;
        height: 200px;
        background-color: #3498db;
        border-radius: 10px;
        margin: 30px 0;
        transition: background-color 0.3s ease;
      }

      #change-color-btn {
        padding: 12px 28px;
        font-size: 18px;
        color: white;
        background-color: #2c3e50;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      #change-color-btn:hover {
        background-color: #1a252f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>couleur Changer</h1>
      <div id="color-box"></div>
      <button id="change-color-btn">Change couleur</button>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const colorBox = document.getElementById("color-box");
        const changeColorBtn = document.getElementById("change-color-btn");

        // Génère un code hexadécimal aléatoire, par exemple "#a3f20c"
        function getRandomColor() {
          const letters = "0123456789ABCDEF";
          let color = "#";
          for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
          }
          return color;
        }

        // Au clic, change la couleur de fond de la boîte
        changeColorBtn.addEventListener("click", () => {
          colorBox.style.backgroundColor = getRandomColor();
        });
      });
    </script>
  </body>
</html>
